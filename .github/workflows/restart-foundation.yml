name: restart-foundation

on:
  pull_request:
    paths:
      - "ARC-AGI-3-Agents/arc3_agi_agent/**"
      - "ARC-AGI-3-Agents/tests/unit/test_arc3_agi_foundation.py"
      - ".github/workflows/restart-foundation.yml"
  push:
    branches:
      - main
    paths:
      - "ARC-AGI-3-Agents/arc3_agi_agent/**"
      - "ARC-AGI-3-Agents/tests/unit/test_arc3_agi_foundation.py"
      - ".github/workflows/restart-foundation.yml"

permissions:
  contents: read

jobs:
  foundation-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ARC-AGI-3-Agents
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile foundation package
        run: python -m compileall -q arc3_agi_agent

      - name: Run foundation unit tests
        run: python -m unittest discover -s tests/unit -p "test_arc3_agi_foundation.py" -v
