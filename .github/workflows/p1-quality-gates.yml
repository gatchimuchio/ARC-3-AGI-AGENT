name: p1-quality-gates

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ARC-AGI-3-Agents/arc3_agi_agent/**"
      - "ARC-AGI-3-Agents/agents/__init__.py"
      - "ARC-AGI-3-Agents/agents/recorder.py"
      - "ARC-AGI-3-Agents/agents/templates/layer0_sample_agent.py"
      - "ARC-AGI-3-Agents/sample_main.py"
      - "ARC-AGI-3-Agents/tests/**"
      - "ARC-AGI-3-Agents/pyproject.toml"
      - "ARC-AGI-3-Agents/uv.lock"
      - "environment_files/**"
      - "docs/architecture/**"
      - ".github/workflows/p1-quality-gates.yml"

permissions:
  contents: read

jobs:
  p1-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ARC-AGI-3-Agents
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Compile P1 implementation
        run: uv run python -m compileall -q arc3_agi_agent agents tests/unit

      - name: Run unit contracts
        run: uv run python -m unittest discover -s tests/unit -p "test_*.py" -v

      - name: Run unit and OFFLINE integration tests
        run: uv run python -m pytest -q tests

      - name: Run static checks
        run: >-
          uv run ruff check
          arc3_agi_agent
          agents/__init__.py
          agents/recorder.py
          tests/conftest.py
          tests/unit

      - name: Run all-sample one-action smoke
        run: uv run python sample_main.py --all-samples --max-actions 1
