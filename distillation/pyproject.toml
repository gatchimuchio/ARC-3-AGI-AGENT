[project]
name = "hds-distill"
version = "0.0.1"
description = "Isolated HDS distillation boundary for ARC3 PH-D00B"
readme = "README.md"
requires-python = "==3.12.13"
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy==1.17.1",
    "pytest==8.4.1",
    "ruff==0.12.7",
]

[project.scripts]
hds-distillation-scope-guard = "hds_distill.scope_guard:main"

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "src",
    "tests",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "UP",
]
